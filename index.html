<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godstime League</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07122c;
padding:20px;
color:white;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
font-size:40px;
color:#ffd700;
}

.card{
background:#0d1b3d;
padding:20px;
border-radius:20px;
margin-bottom:25px;
}

.card h2{
margin-bottom:15px;
color:#ffd700;
}

input,button{
padding:12px;
border:none;
border-radius:10px;
margin:5px;
font-size:15px;
}

button{
background:#ffd700;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.fixtureCard{
background:#13244f;
border-radius:20px;
padding:20px;
margin-top:20px;
}

.fixtureTime{
text-align:center;
color:#ffd700;
font-weight:bold;
margin-bottom:15px;
font-size:20px;
}

.fixtureTeams{
display:flex;
justify-content:space-between;
align-items:center;
}

.team{
width:35%;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}

.team img{
width:70px;
height:70px;
object-fit:contain;
margin-bottom:10px;
}

.playerName{
font-size:28px;
font-weight:bold;
}

.clubName{
font-size:18px;
color:#ccc;
}

.vs{
font-size:35px;
font-weight:bold;
color:#ffd700;
}

.scoreBox{
margin-top:20px;
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

.scoreInput{
width:70px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

th{
background:#020617;
}

.tablePlayer{
display:flex;
align-items:center;
gap:10px;
}

.tablePlayer img{
width:35px;
height:35px;
object-fit:contain;
}

.top4{
background:rgba(0,255,100,0.15);
}

.relegation{
background:rgba(255,0,0,0.15);
}

@media(max-width:768px){

.fixtureTeams{
flex-direction:column;
gap:20px;
}

.team{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<h1>🏆 GODSTIME PREMIER LEAGUE</h1>

<!-- REGISTRATION -->

<div class="card">

<h2>📝 Registration Board</h2>

<input type="text" id="playerName" placeholder="Enter Player Name">

<button onclick="registerPlayer()">
Register Player
</button>

<p id="nextClub" style="margin-top:10px;"></p>

</div>

<!-- FIXTURES -->

<div class="card">

<h2>⚽ Match Fixtures</h2>

<input type="text" id="matchTime" placeholder="Add Match Time">

<button onclick="generateFixtures()">
Generate Next Matchday
</button>

<div id="fixtures"></div>

</div>

<!-- TABLE -->

<div class="card">

<h2>📊 League Table</h2>

<table>

<thead>

<tr>
<th>Pos</th>
<th>Player</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>GF</th>
<th>GA</th>
<th>GD</th>
<th>Pts</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>

const clubs = [

["Chelsea","https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg"],
["Arsenal","https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg"],
["Liverpool","https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg"],
["Manchester City","https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg"],
["Manchester United","https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg"],
["Barcelona","https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"],
["Real Madrid","https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"],
["PSG","https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg"],
["AC Milan","https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg"],
["Dortmund","https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg"],
["Tottenham","https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg"],
["Juventus","https://upload.wikimedia.org/wikipedia/commons/1/15/Juventus_FC_2017_logo.svg"],
["Inter Milan","https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg"],
["Bayern","https://upload.wikimedia.org/wikipedia/commons/1/1f/FC_Bayern_München_logo_%282017%29.svg"],
["Napoli","https://upload.wikimedia.org/wikipedia/commons/2/2d/SSC_Neapel.svg"],
["Ajax","https://upload.wikimedia.org/wikipedia/en/7/79/Ajax_Amsterdam.svg"],
["Roma","https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg"],
["Atletico","https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg"],
["Benfica","https://upload.wikimedia.org/wikipedia/en/a/a2/SL_Benfica_logo.svg"],
["Porto","https://upload.wikimedia.org/wikipedia/en/f/f1/FC_Porto.svg"]

];

let players = [];
let fixtures = [];
let clubIndex = 0;

document.getElementById("nextClub").innerHTML =
"Next Club: " + clubs[clubIndex][0];

function registerPlayer(){

const name = document.getElementById("playerName").value;

if(name === ""){
alert("Enter player name");
return;
}

players.push({

player:name,
club:clubs[clubIndex][0],
logo:clubs[clubIndex][1],

played:0,
win:0,
draw:0,
loss:0,
gf:0,
ga:0,
gd:0,
pts:0

});

clubIndex++;

if(clubIndex >= clubs.length){
clubIndex = 0;
}

document.getElementById("playerName").value = "";

document.getElementById("nextClub").innerHTML =
"Next Club: " + clubs[clubIndex][0];

renderTable();

}

function generateFixtures(){

if(players.length < 20){
alert("Register all 20 players");
return;
}

const time = document.getElementById("matchTime").value;

if(time === ""){
alert("Add Match Time");
return;
}

fixtures = [];

const fixtureBox = document.getElementById("fixtures");

fixtureBox.innerHTML = "";

let shuffled = [...players].sort(()=>Math.random()-0.5);

for(let i=0;i<20;i+=2){

let home = shuffled[i];
let away = shuffled[i+1];

fixtures.push({
home,
away,
played:false
});

fixtureBox.innerHTML += `

<div class="fixtureCard">

<div class="fixtureTime">
${time}
</div>

<div class="fixtureTeams">

<div class="team">

<img src="${home.logo}">

<div class="playerName">
${home.player}
</div>

<div class="clubName">
${home.club}
</div>

</div>

<div class="vs">
VS
</div>

<div class="team">

<img src="${away.logo}">

<div class="playerName">
${away.player}
</div>

<div class="clubName">
${away.club}
</div>

</div>

</div>

<div class="scoreBox">

<input type="number"
class="scoreInput"
id="h${i}">

-

<input type="number"
class="scoreInput"
id="a${i}">

<button onclick="saveResult(${i})">
Save Result
</button>

</div>

</div>

`;

}

}

function saveResult(index){

let fixture = fixtures[index/2];

if(fixture.played){
alert("Result already saved");
return;
}

let home = fixture.home;
let away = fixture.away;

let hg = Number(document.getElementById("h"+index).value);
let ag = Number(document.getElementById("a"+index).value);

fixture.played = true;

home.played++;
away.played++;

home.gf += hg;
home.ga += ag;

away.gf += ag;
away.ga += hg;

home.gd = home.gf - home.ga;
away.gd = away.gf - away.ga;

if(hg > ag){

home.win++;
home.pts += 3;

away.loss++;

}

else if(ag > hg){

away.win++;
away.pts += 3;

home.loss++;

}

else{

home.draw++;
away.draw++;

home.pts++;
away.pts++;

}

renderTable();

}

function renderTable(){

players.sort((a,b)=>{

if(b.pts !== a.pts){
return b.pts - a.pts;
}

if(b.gd !== a.gd){
return b.gd - a.gd;
}

return b.gf - a.gf;

});

const body = document.getElementById("tableBody");

body.innerHTML = "";

players.forEach((team,index)=>{

let rowClass = "";

if(index < 4){
rowClass = "top4";
}

if(index >= 17){
rowClass = "relegation";
}

body.innerHTML += `

<tr class="${rowClass}">

<td>${index+1}</td>

<td>

<div class="tablePlayer">

<img src="${team.logo}">

<span>${team.player}</span>

</div>

</td>

<td>${team.played}</td>
<td>${team.win}</td>
<td>${team.draw}</td>
<td>${team.loss}</td>
<td>${team.gf}</td>
<td>${team.ga}</td>
<td>${team.gd}</td>
<td>${team.pts}</td>

</tr>

`;

});

}

renderTable();

</script>

</body>
</html>
