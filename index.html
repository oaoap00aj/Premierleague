<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godstime League Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#07122c;
padding:20px;
color:white;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
font-size:40px;
color:#ffd700;
}

.card{
background:#0d1b3d;
padding:20px;
border-radius:20px;
margin-bottom:25px;
}

h2{
color:#ffd700;
margin-bottom:15px;
}

input,button{
padding:10px;
border:none;
border-radius:8px;
margin:5px;
font-size:14px;
}

button{
background:#ffd700;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
padding:10px;
text-align:center;
border-bottom:1px solid rgba(255,255,255,0.1);
}

th{
background:#020617;
}

.tablePlayer{
display:flex;
align-items:center;
gap:10px;
}

.tablePlayer img{
width:30px;
height:30px;
}

/* FIXTURES */
.fixtureTable{
width:100%;
border-collapse:collapse;
text-align:center;
margin-top:10px;
}

.fixtureTable th{
background:#020617;
padding:10px;
}

.fixtureTable td{
padding:10px;
}

.teamBox{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.teamBox img{
width:25px;
height:25px;
}

/* RESULTS */
.resultRow{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:10px;
padding:10px;
background:#13244f;
border-radius:10px;
flex-wrap:wrap;
}

.resultRow input{
width:60px;
text-align:center;
}

/* STATUS */
.relegated{
background:rgba(255,0,0,0.25);
}

.top4{
background:rgba(0,255,100,0.15);
}

</style>
</head>

<body>

<div class="container">

<h1>🏆 GODSTIME LEAGUE PRO</h1>

<!-- REGISTER -->
<div class="card">

<h2>📝 Registration</h2>

<input id="playerName" placeholder="Player Name">
<button onclick="registerPlayer()">Register</button>

<p id="nextClub"></p>

</div>

<!-- FIXTURES -->
<div class="card">

<h2>⚽ Fixtures</h2>

<input id="matchTime" placeholder="Match Time">
<button onclick="generateFixtures()">Generate Matchday</button>

<div id="fixtures"></div>

</div>

<!-- TABLE -->
<div class="card">

<h2>📊 League Table</h2>

<table>
<thead>
<tr>
<th>Pos</th>
<th>Player</th>
<th>P</th>
<th>W</th>
<th>D</th>
<th>L</th>
<th>GF</th>
<th>GA</th>
<th>GD</th>
<th>Pts</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<button onclick="resetLeague()">🔁 Reset League</button>

<div id="resultsBoard"></div>

</div>

</div>

<script>

/* CLUBS (20) */
const clubs = [
["Chelsea","https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg"],
["Arsenal","https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg"],
["Liverpool","https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg"],
["Man City","https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg"],
["Man United","https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg"],
["Barcelona","https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"],
["Real Madrid","https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"],
["PSG","https://upload.wikimedia.org/wikipedia/en/a/a7/Paris_Saint-Germain_F.C..svg"],
["AC Milan","https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg"],
["Dortmund","https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg"],
["Tottenham","https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg"],
["Juventus","https://upload.wikimedia.org/wikipedia/commons/1/15/Juventus_FC_2017_logo.svg"],
["Inter Milan","https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg"],
["Bayern","https://upload.wikimedia.org/wikipedia/commons/1/1f/FC_Bayern_München_logo_%282017%29.svg"],
["Napoli","https://upload.wikimedia.org/wikipedia/commons/2/2d/SSC_Neapel.svg"],
["Ajax","https://upload.wikimedia.org/wikipedia/en/7/79/Ajax_Amsterdam.svg"],
["Roma","https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg"],
["Atletico Madrid","https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg"],
["Benfica","https://upload.wikimedia.org/wikipedia/en/a/a2/SL_Benfica_logo.svg"],
["Porto","https://upload.wikimedia.org/wikipedia/en/f/f1/FC_Porto.svg"]
];

let players = [];
let activePlayers = [];
let fixtures = [];
let clubIndex = 0;
let matchCount = 0;

/* INIT */
function load(){
players = JSON.parse(localStorage.getItem("players")) || [];
activePlayers = JSON.parse(localStorage.getItem("activePlayers")) || players;
clubIndex = Number(localStorage.getItem("clubIndex")) || 0;
matchCount = Number(localStorage.getItem("matchCount")) || 0;

document.getElementById("nextClub").innerHTML =
"Next Club: " + clubs[clubIndex][0];

renderTable();
renderResults();
}

load();

/* SAVE */
function save(){
localStorage.setItem("players",JSON.stringify(players));
localStorage.setItem("activePlayers",JSON.stringify(activePlayers));
localStorage.setItem("clubIndex",clubIndex);
localStorage.setItem("matchCount",matchCount);
}

/* REGISTER */
function registerPlayer(){

let name = document.getElementById("playerName").value;
if(name==="") return;

let obj = {
player:name,
club:clubs[clubIndex][0],
logo:clubs[clubIndex][1],
played:0,win:0,draw:0,loss:0,gf:0,ga:0,gd:0,pts:0
};

players.push(obj);
activePlayers.push(obj);

clubIndex++;
if(clubIndex>=clubs.length) clubIndex=0;

document.getElementById("playerName").value="";

document.getElementById("nextClub").innerHTML =
"Next Club: " + clubs[clubIndex][0];

renderTable();
save();
}

/* FIXTURES */
function generateFixtures(){

let time=document.getElementById("matchTime").value;
if(time==="") return alert("Add time");

fixtures=[];
let box=document.getElementById("fixtures");

let shuffled=[...activePlayers].sort(()=>Math.random()-0.5);

let html=`
<h3 style="color:#ffd700;text-align:center">Match Time: ${time}</h3>

<table class="fixtureTable">
<tr><th>Home</th><th>VS</th><th>Away</th></tr>
`;

for(let i=0;i<shuffled.length;i+=2){

let h=shuffled[i];
let a=shuffled[i+1];
if(!h||!a) break;

fixtures.push({home:h,away:a,played:false});

html+=`
<tr>
<td class="teamBox"><img src="${h.logo}">${h.player}</td>
<td style="color:#ffd700">VS</td>
<td class="teamBox"><img src="${a.logo}">${a.player}</td>
</tr>
`;
}

html+="</table>";

box.innerHTML=html;

renderResults();
save();
}

/* SAVE RESULT */
function saveResult(i){

let f=fixtures[i];
if(f.played) return;

let hg=+document.getElementById("h"+i).value;
let ag=+document.getElementById("a"+i).value;

f.played=true;
f.hg=hg;
f.ag=ag;

let h=f.home;
let a=f.away;

h.played++;a.played++;
h.gf+=hg;h.ga+=ag;
a.gf+=ag;a.ga+=hg;

h.gd=h.gf-h.ga;
a.gd=a.gf-a.ga;

if(hg>ag){h.win++;h.pts+=3;a.loss++;}
else if(ag>hg){a.win++;a.pts+=3;h.loss++;}
else{h.draw++;a.draw++;h.pts++;a.pts++;}

renderTable();
renderResults();
checkRelegation();
save();
}

/* RELEGATION */
function checkRelegation(){

matchCount++;

if(matchCount===10||matchCount===12){

activePlayers.sort((a,b)=>a.pts-b.pts);

let out=activePlayers.slice(0,2);

activePlayers=activePlayers.filter(p=>!out.includes(p));

alert("Relegated: "+out.map(p=>p.player).join(", "));

renderTable();
}
}

/* TABLE */
function renderTable(){

let body=document.getElementById("tableBody");
body.innerHTML="";

activePlayers
.sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)
.forEach((p,i)=>{

body+=`
<tr class="${i<4?'top4':''}">
<td>${i+1}</td>
<td class="tablePlayer"><img src="${p.logo}">${p.player}</td>
<td>${p.played}</td>
<td>${p.win}</td>
<td>${p.draw}</td>
<td>${p.loss}</td>
<td>${p.gf}</td>
<td>${p.ga}</td>
<td>${p.gd}</td>
<td>${p.pts}</td>
</tr>
`;

});

document.getElementById("tableBody").innerHTML=body;
}

/* RESULTS */
function renderResults(){

let board=document.getElementById("resultsBoard");

board.innerHTML="<h3 style='color:#ffd700'>📊 Results</h3>";

fixtures.forEach((f,i)=>{

if(!f.played){

board.innerHTML+=`
<div class="resultRow">
<div>${f.home.player} vs ${f.away.player}</div>

<div>
<input id="h${i}" type="number"> -
<input id="a${i}" type="number">
<button onclick="saveResult(${i})">Save</button>
</div>
</div>
`;

}else{

board.innerHTML+=`
<div class="resultRow">
<b>${f.home.player}</b> ${f.hg} - ${f.ag} <b>${f.away.player}</b>
</div>
`;

}

});

}

/* RESET */
function resetLeague(){

if(!confirm("Reset league?")) return;

localStorage.clear();

players=[];
activePlayers=[];
fixtures=[];
clubIndex=0;
matchCount=0;

location.reload();
}

</script>

</body>
</html>
